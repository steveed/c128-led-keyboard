# Containers for this repo's tooling.
#
#   freerouting  the Freerouting autorouter for the rev 3 board (pcb/freerouting/Dockerfile)
#
#   krt   KiCadRoutingTools' placer and checks, pinned and built native (pcb/krt/Dockerfile).
#
#   openscad  OpenSCAD for the printed parts in printables/ (`make adapters`).
#
#   kicad  KiCad 10's kicad-cli, for the README renders (`make render`) and CI.  The local
#          pcbnew scripts in pcb/tools still use the KiCad app's python on the host.
#
#   idf   ESP-IDF (Espressif's official image) for building the rev 3 keyboard firmware.
#         Build:      docker compose run --rm idf idf.py build
#         Configure:  docker compose run --rm idf idf.py menuconfig
#         See firmware/README.md; `make -C firmware build` wraps this.
#
# Flashing and the serial monitor need the USB port, which Docker Desktop on macOS cannot
# pass through, so those two steps run a small host-side esptool (firmware/Makefile
# `flash` / `monitor`).  Everything else stays in the container.

services:
  idf:
    image: espressif/idf:release-v5.4
    working_dir: /project/firmware
    volumes:
      - .:/project
      - idf-ccache:/root/.ccache
    environment:
      - IDF_CCACHE_ENABLE=1
      - IDF_TARGET=esp32s3
    command: idf.py build

  kicad:
    image: kicad/kicad:10.0-full
    platform: linux/amd64
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /repo
    volumes:
      - .:/repo

  openscad:
    image: openscad/openscad:dev
    platform: linux/amd64
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /repo
    volumes:
      - .:/repo

  freerouting:
    # Freerouting 2.5.0 autorouter, headless.  Run from pcb/tools/freeroute.py, which exports
    # the board to Specctra DSN, runs this, and imports the session back:
    #   docker compose run --rm freerouting -de out/board.dsn -do out/board.ses -mp 30
    build: pcb/freerouting
    working_dir: /work
    volumes:
      - ./pcb:/work

  krt:
    # KiCadRoutingTools' placer and checks, baked into the image at KRT_COMMIT with its Rust
    # router compiled for this machine (pcb/krt/Dockerfile).  This repo is at /repo; working
    # files go in build/placement/ (not committed):
    #   docker compose run --rm krt py_placer/place_simple.py /repo/build/placement/fixed.kicad_pcb ...
    build:
      context: pcb/krt
      args:
        KRT_COMMIT: be713c55eb8698bf056c9b64a0827528268bca5f
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /krt
    volumes:
      - .:/repo

volumes:
  idf-ccache:
